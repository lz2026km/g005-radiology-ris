<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>放射RIS系统 v3.0.6.8-24 - 交互深度测试 + DictionaryPage React #310 修复</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%231e40af'/%3E%3Cpath d='M12 7v5l3 3' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // === v3.0.6.8-23d: �ռ��޸� - LoginPage �����ܱ���Ⱦ (�� AppLayout �Ƶ����? ===
      window.__errors = [];
      window.__appVersion = '3.0.6.8-24';
      window.__bootStart = Date.now();

      // SPA redirect for GitHub Pages 404.html trick
      (function() {
        var redirect = sessionStorage.getItem('redirect');
        if (redirect && redirect !== location.href) {
          sessionStorage.removeItem('redirect');
          history.replaceState(null, '', redirect);
        }
      })();

      function dumpError(label, e) {
        try {
          // 提取 ErrorEvent 的真实信�?
          var realErr = e && e.error ? e.error : (e && e.reason ? e.reason : e);
          var msg = (realErr && realErr.message) ? realErr.message : (typeof realErr === 'string' ? realErr : 'unknown');
          var fn = (e && e.filename) || (realErr && realErr.fileName) || '';
          var ln = (e && e.lineno) || (realErr && realErr.lineNumber) || '';
          var stack = (realErr && realErr.stack) || '';
          // 详细调试: 列出 e 的所�?keys
          var eKeys = [];
          try { for (var k in e) eKeys.push(k + '=' + String(e[k]).substring(0, 80)); } catch(_) {}
          console.error('[v3.0.6.8-24] ' + label + ':', {msg, fn, ln, stack, eKeys: eKeys.join('|')});
        } catch(_) {}
      }

      window.addEventListener('error', function(e) {
        // 过滤掉非致命错误
        if (e && e.target && (e.target instanceof HTMLImageElement || e.target instanceof HTMLLinkElement)) {
          return; // 图片/资源加载失败,不影响功�?
        }
        dumpError('window.error', e);
        var realErr = e && e.error ? e.error : e;
        window.__errors.push({
          msg: (realErr && realErr.message) ? realErr.message : String(realErr || 'unknown'),
          filename: e && e.filename || '',
          lineno: e && e.lineno || '',
          stack: (realErr && realErr.stack) || ''
        });
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        dumpError('unhandledrejection', e);
        window.__errors.push({
          msg: 'Promise: ' + String((e.reason && e.reason.message) || e.reason || 'unknown'),
          stack: (e.reason && e.reason.stack) || ''
        });
      });
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>JavaScript 未启用，请启用 JavaScript 后刷新页面。</noscript>
      <div id="loading-placeholder" role="status" aria-live="polite" aria-busy="true" aria-label="系统加载中" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#94a3b8;font-family:sans-serif;font-size:14px;z-index:9999">
        <div style="text-align:center">
          <div style="width:32px;height:32px;margin:0 auto 12px;border:3px solid #334155;border-top-color:#3b82f6;border-radius:50%;animation:spin-l 0.8s linear infinite"></div>
          <div>系统加载中...</div>
          <style>@keyframes spin-l{to{transform:rotate(360deg)}}</style>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
