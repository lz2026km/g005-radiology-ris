<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>放射科RIS系统 v3.0.6.8-10 · SW 清理不再卡死</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%231e40af'/%3E%3Cpath d='M12 7v5l3 3' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <script>
      // === v3.0.6.8-10: 终极修复 - SW getRegistrations 不再阻塞 bootstrap ===
      window.__errors = [];
      window.__appVersion = '3.0.6.8-10';
      window.__bootStart = Date.now();

      // SPA redirect for GitHub Pages 404.html trick
      (function() {
        var redirect = sessionStorage.getItem('redirect');
        if (redirect && redirect !== location.href) {
          sessionStorage.removeItem('redirect');
          history.replaceState(null, '', redirect);
        }
      })();

      function dumpError(label, e) {
        try {
          var msg = (e && (e.message || e.error || e.reason)) || 'unknown';
          var fn = e && (e.filename || e.fileName || '') || '';
          var ln = e && (e.lineno || e.lineNumber || e.line || '') || '';
          var stack = (e && (e.error && e.error.stack)) || e.stack || '';
          console.error('[v3.0.6.8-10] ' + label + ':', {msg, fn, ln, stack});
        } catch(_) {}
      }

      window.addEventListener('error', function(e) {
        dumpError('window.error', e);
        window.__errors.push({
          msg: String((e && (e.message || e.error)) || 'unknown'),
          filename: e && e.filename || '',
          lineno: e && e.lineno || ''
        });
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        dumpError('unhandledrejection', e);
        window.__errors.push({
          msg: 'Promise: ' + String(e.reason || 'unknown'),
          stack: (e.reason && e.reason.stack) || ''
        });
      });
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>JavaScript 未启用，请启用 JavaScript 后刷新页面。</noscript>
      <div id="loading-placeholder" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f8fafc;color:#1e293b;font-family:sans-serif;font-size:16px;z-index:9999">
        <div style="text-align:center">
          <div style="width:40px;height:40px;margin:0 auto 16px;border:4px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin-l 0.8s linear infinite"></div>
          <div>加载中...</div>
          <style>@keyframes spin-l{to{transform:rotate(360deg)}}</style>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
