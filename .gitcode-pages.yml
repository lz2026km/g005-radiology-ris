# G005 放射RIS系统 v3.0.2.2 - GitCode Pages 部署配置
# 详细文档:https://docs.gitcode.com/docs/pages/

# 静态站点配置
site:
  name: g005-radiology-ris

# Node 版本(必需 >= 20)
node:
  version: 20

# 构建阶段
build:
  # 构建命令(在仓库根目录执行)
  command: |
    npm install --legacy-peer-deps --no-audit --no-fund
    npm run build
  # 构建产物目录(将作为静态站点根目录)
  output: dist
  # 公共目录(直接复制到 dist/)
  public: public
  # 构建缓存(加速二次构建)
  cache:
    paths:
      - node_modules/

# 部署阶段
deploy:
  environment: production
  # SPA 路由回退(深链刷新)
  not_found_page: 404.html
