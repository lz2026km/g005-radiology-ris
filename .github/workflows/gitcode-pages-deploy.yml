# G005 放射RIS系统 v3.0.2.2 - GitCode Pages 自动部署
# 此文件由 GitCode Pages 自动读取并执行
# 等同于 .gitcode-pages.yml 的进阶版(支持 hook 事件)

name: GitCode Pages Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: '强制重新构建(忽略缓存)'
        required: false
        default: 'false'

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  SITE_NAME: g005-radiology-ris

jobs:
  build:
    name: Build & Deploy to GitCode Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Show environment
        run: |
          echo "🔧 Node: $(node --version)"
          echo "🔧 npm: $(npm --version)"
          echo "🔧 Branch: ${{ github.ref_name }}"
          echo "🔧 SHA: ${{ github.sha }}"
          echo "🔧 Site: ${{ env.SITE_NAME }}"

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies (npm)..."
          npm install --legacy-peer-deps --no-audit --no-fund
          echo "✅ Dependencies installed: $(ls node_modules | wc -l) packages"

      - name: Build
        env:
          VITE_RELEASE: v${{ github.ref_name }}-${{ github.sha }}
        run: |
          echo "🏗️  Building production bundle..."
          npm run build
          echo "✅ Build complete"
          echo "📊 dist/ size: $(du -sh dist | cut -f1)"
          echo "📊 dist/ files: $(find dist -type f | wc -l)"

      - name: Verify SPA 404 fallback
        run: |
          echo "🔍 Verifying SPA 404 fallback (404.html == index.html)..."
          if [ -f dist/404.html ] && [ -f dist/index.html ]; then
            HASH1=$(sha256sum dist/index.html | awk '{print $1}')
            HASH2=$(sha256sum dist/404.html | awk '{print $1}')
            if [ "$HASH1" = "$HASH2" ]; then
              echo "✅ 404.html SHA256 == index.html SHA256"
            else
              echo "❌ Hash mismatch"
              exit 1
            fi
          else
            echo "❌ Missing 404.html or index.html"
            exit 1
          fi

      - name: Verify dist content
        run: |
          echo "=== dist/ 目录 ==="
          ls -la dist/
          echo "=== dist/assets (前 20) ==="
          ls -la dist/assets/ | head -20
          echo "=== dist 关键文件 ==="
          [ -f dist/index.html ] && echo "✅ index.html ($(wc -c < dist/index.html) bytes)" || echo "❌ index.html missing"
          [ -f dist/404.html ] && echo "✅ 404.html ($(wc -c < dist/404.html) bytes)" || echo "❌ 404.html missing"
          [ -f dist/sw.js ] && echo "✅ sw.js ($(wc -c < dist/sw.js) bytes)" || echo "❌ sw.js missing"
          [ -d dist/assets ] && echo "✅ assets/ ($(ls dist/assets | wc -l) files)" || echo "❌ assets/ missing"

      - name: Check base path
        run: |
          echo "🔍 Checking base path in index.html..."
          if grep -q '/g005-radiology-ris/' dist/index.html; then
            echo "✅ Base path /g005-radiology-ris/ configured correctly"
          else
            echo "⚠️  Base path not found in index.html (检查 vite.config.ts base)"
            grep -o 'href="[^"]*index[^"]*"' dist/index.html | head -3
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitCode Pages
        id: deployment
        if: success()
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITCODE_TOKEN }}
          base_url: /${{ env.SITE_NAME }}

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            echo "🎉 Deployment successful!"
            echo "🔗 URL: https://${{ github.repository_owner }}.gitcode.io/${{ env.SITE_NAME }}/"
          else
            echo "❌ Deployment failed"
            exit 1
          fi
