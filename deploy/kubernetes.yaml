apiVersion: apps/v1
kind: Deployment
metadata:
  name: g005-ris
  labels:
    app: g005-ris
spec:
  replicas: 2
  selector:
    matchLabels:
      app: g005-ris
  template:
    metadata:
      labels:
        app: g005-ris
    spec:
      containers:
        - name: ris-backend
          image: g005/ris:3.0.3.30
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - g005-ris
                topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: g005-ris-service
spec:
  selector:
    app: g005-ris
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: g005-ris-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: g005-ris
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: g005-ris-config
data:
  NODE_ENV: production
  PORT: "3001"
  LOG_LEVEL: info
---
apiVersion: v1
kind: Secret
metadata:
  name: g005-ris-secret
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production"
  DB_PASSWORD: "change-me-in-production"
